# Baseline pipeline configuration.
# Nothing here is hardcoded in the source files below -- everything tunable lives in this one place.

data:
  path: "data/compas_two_year_recidivism.csv"
  target: "two_year_recid"
  sensitive_attr: "race"          # excluded from model features, used only to audit fairness
  drop_columns: ["id", "decile_score", "score_text"]  # identifiers / COMPAS's own score, not our model's inputs


diagnostics:
  id_column: "id"

  numeric_text_columns:
    - "priors_count"
    - "prior_offenses"

  placeholder_tokens:
    - "-"
    - "?"
    - "n/a"
    - "N/A"
    - "na"
    - "NA"
    - ""

  validity_rules:
    age:
      min: 18
      max: 100
    decile_score:
      min: 1
      max: 10
    juv_fel_count:
      min: 0
    priors_count:
      min: 0
      max: 60

    category_mappings:
      sex:
        male: "Male"
        female: "Female"

      race:
        african-american: "African-American"
        african american: "African-American"
        caucasian: "Caucasian"
        hispanic: "Hispanic"
        other: "Other"
        asian: "Asian"
        native american: "Native American"

      c_charge_degree:
        f: "F"
        felony: "F"
        m: "M"
        misdemeanor: "M"

      score_text:
        low: "Low"
        medium: "Medium"
        high: "High"

    columns_to_drop:
      - "prior_offenses"
      - "age_in_months"
      - "juvenile_total"
      - "id"

split:
  test_size: 0.2
  random_state: 42

preprocessing:
  encoder: "target"
  scaler: "standard"

  numeric_features:
    - "age"
    - "juv_fel_count"
    - "juv_misd_count"
    - "juv_other_count"
    - "priors_count"

  categorical_features:
    - "sex"
    - "age_cat"
    - "c_charge_degree"

  mnar_indicator_sources:
    - "priors_count"
    - "c_charge_degree"

  imputation:
    numeric_strategy: "median"
    categorical_strategy: "most_frequent"

model:
  type: "decision_tree"   # or "decision_tree"
  params:
    random_state: 42
 
output:
  results_dir: "results"   # each run's full report is saved here as a timestamped .txt file
